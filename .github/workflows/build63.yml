name: PTSpeed Build 63

on:
  push:
  pull_request:

jobs:
  build63:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CocoaPods dependencies
        run: pod install --deployment
      - name: Run Build 63 checks
        env:
          RUN_SIMULATOR_TESTS: "1"
        run: ./Scripts/build63_checks.sh
