name: PTSpeed Build 65

on:
  push:
  pull_request:

jobs:
  build65:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CocoaPods dependencies
        run: pod install --deployment
      - name: Run Build 65 checks
        env:
          RUN_XCODE_BUILD: "1"
          RUN_RELEASE_BUILD: "1"
          RUN_SIMULATOR_TESTS: "1"
        run: ./Scripts/build65_checks.sh
