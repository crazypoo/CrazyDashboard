name: Documentation governance

on:
  pull_request:
    paths:
      - "**/*.md"
      - "Scripts/docs_lint.sh"
      - "Scripts/generate_docs_index.py"
      - ".github/workflows/docs-governance.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "Scripts/docs_lint.sh"
      - "Scripts/generate_docs_index.py"
      - ".github/workflows/docs-governance.yml"

jobs:
  docs:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate documentation metadata and links
        run: Scripts/docs_lint.sh
      - name: Check generated documentation index
        run: Scripts/generate_docs_index.py --check
