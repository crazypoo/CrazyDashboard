name: Sync TestFlight Version

on:
  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

  push:
    branches:
      - main
    paths:
      - "Config/TestFlight/policy.json"
      - "Scripts/TestFlightVersionSync/sync.mjs"
      - ".github/workflows/sync-testflight-version.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync TestFlight
        run: node Scripts/TestFlightVersionSync/sync.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_BUNDLE_ID: ${{ vars.ASC_BUNDLE_ID }}
          ASC_BETA_GROUP_NAME: ${{ vars.ASC_BETA_GROUP_NAME }}

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ".pages"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4